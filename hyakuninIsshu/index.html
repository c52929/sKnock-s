<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="description" content="百人一首ができるコード書いたよ。">
	<title>ひとりでさみしい百人一首</title>
	<link rel="icon" href="icon.png">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<link rel="stylesheet" href="css/styles.min.css">
	<link href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" rel="stylesheet">
</head>
<body>
	<div class="inner">
		<div id="game" class="none">
			<div id="margin"><span class="m1">　</span><span class="m2">　</span></div>
			<div id="question">
				<div id="kami_q"></div>
				<div id="shimo_q"></div>
			</div>
			<div id="cards"></div>
			<div id="circle"></div>
			<div id="footer">
				<div class="menu" id="stop"><i class="fas fa-pause" id="playStateSign"></i></div>
				<div></div>
				<div class="menu" id="skip"><i class="fas fa-angle-double-right"></i></div>
			</div>
			<!-- <div class="stopper none" id="stopper"></div> -->
		</div>
		<p id="tellEnd" class="none">終了</p>
		<div id="settings">
			<div id="opening">
				<h1>ひとりでさみしい百人一首</h1>
				<p>百人一首ができるゲームを作ったけど、ひとりだとやっぱり<b>つまんない</b>し、<b>飽きる</b>し、<b>目も悪くなる</b>ので、、うーん。<b>あまりよろしくない</b>。</p>
				<p>できるだけ、デヴァイスの所有者ご自身及びお子様をこのゲームから遠ざけ、ご家族やお友達と一緒に<b>カルタで</b>遊びましょう。その方が楽しいですし、楽しいですし、楽しいですし、、何より<b>さみしくない</b>です。</p>
			</div>
			<div id="setting">
				<div>
					<label for="howMany">枚数</label>
					<input type="number" id="howMany" max=100 min=10 placeholder="枚数を入力" value=10>
				</div>
				<p id="error" class="none">※10以上100以下の整数を半角で入力</p>
				<div>
					<span>上の句で止める</span>
					<div class="on-off off" id="tooRead"></div>
				</div>
			</div>
			<button id="startBtn" class="enabled">はじめる</button>
		</div>
		<div id="again" class="none">もういちど</div>
	</div>
	<script src="js/data.js"></script>
	<script src="js/script.js"></script>
</body>
</html>
